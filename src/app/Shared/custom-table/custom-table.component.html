<div class="table-nexus-container fade-in-container">
  <p-table
    #dt
    [value]="data"
    [rows]="selectedRowsCount"
    [paginator]="true"
    [globalFilterFields]="globalFilterFields"
    styleClass="p-datatable-striped custom-modern-grid"
    [rowsPerPageOptions]="[5, 10, 25, 50]"
  >
    <!-- 1. Upper Toolbar -->
    <ng-template pTemplate="caption">
      <div class="table-header-toolbar">
        <div class="toolbar-left-pane">
          <p-select
            [(ngModel)]="selectedRowsCount"
            [options]="rowsOptions"
            optionLabel="label"
            optionValue="value"
            styleClass="compact-entries-select"
          ></p-select>
        </div>

        <div class="toolbar-right-pane p-input-icon-left">
          <i class="pi pi-search search-lens-node"></i>
          <input
            pInputText
            type="text"
            [(ngModel)]="globalSearchText"
            (input)="dt.filterGlobal(globalSearchText, 'contains')"
            placeholder="Quick search table items..."
            class="grid-global-search-input"
          />
        </div>
      </div>
    </ng-template>

    <!-- 2. Dynamic Column Headers (*ngFor Loop) -->
    <ng-template pTemplate="header">
      <tr>
        <th
          *ngFor="let col of cols"
          [style.width]="col.width || 'auto'"
          [style.text-align]="col.align || 'left'"
        >
          {{ col.header }}
        </th>

        <!-- Optional Actions Header -->
        <th *ngIf="showActions" style="text-align: center; width: 12%">
          Actions
        </th>

        <!-- Optional More Actions Header -->
        <th *ngIf="showMoreActions" style="text-align: center; width: 15%">
          More Links
        </th>
      </tr>
    </ng-template>

    <!-- 3. Dynamic Cell Value Iterator (*ngFor Loop) -->
    <ng-template pTemplate="body" let-item>
      <tr class="hoverable-grid-row">
        <td
          *ngFor="let col of cols"
          [style.text-align]="col.align || 'left'"
          [ngClass]="{
            'font-bold-slate': col.field === 'diaryNo' || col.field === 'sNo',
            'truncated-cell-text': col.field === 'caseDetails',
          }"
          [title]="getFieldValue(item, col.field)"
        >
          {{ getFieldValue(item, col.field) }}
        </td>

        <!-- Standard Actions Column -->
        <td *ngIf="showActions" style="text-align: center">
          <button
            pButton
            type="button"
            icon="pi pi-eye"
            label="View"
            class="p-button-sm grid-action-view-btn"
            (click)="onViewRecord(item)"
          ></button>
        </td>

        <!-- Dynamic Hyperlink-style Buttons Column -->
        <td *ngIf="showMoreActions" style="text-align: center">
          <div
            style="
              display: flex;
              gap: 8px;
              justify-content: center;
              align-items: center;
              flex-wrap: wrap;
            "
          >
            <ng-container *ngFor="let act of moreActions">
              <!-- Case A: Agar direct anchor link / href ho -->
              <a
                *ngIf="act.url"
                [href]="act.url(item)"
                [target]="act.target || '_blank'"
                pButton
                type="button"
                [icon]="act.icon || ''"
                [label]="act.label"
                class="p-button-link p-button-sm"
              ></a>

              <!-- Case B: Agar button click event trigger karna ho (look link jaisa hi rahega) -->
              <button
                *ngIf="!act.url"
                pButton
                type="button"
                [icon]="act.icon || ''"
                [label]="act.label"
                class="p-button-link p-button-sm"
                (click)="handleActionClick(act, item, $event)"
              ></button>
            </ng-container>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- Empty State Fallback -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td
          [attr.colspan]="
            cols.length + (showActions ? 1 : 0) + (showMoreActions ? 1 : 0)
          "
          class="grid-empty-state-cell"
        >
          <i class="pi pi-filter-slash empty-icon-node"></i>
          <p>No matching legal records matched your search parameters.</p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
