<div class="view-header-nexus">
  <div class="title-accent-wrapper">
    <h2 class="section-title">Case Proceeding Reports</h2>
  </div>
</div>

<div class="fade-in-container">
  <form
    [formGroup]="form"
    (ngSubmit)="onSearch()"
    class="workspace-form-layout-proceeding-case"
  >
    <div class="filter-criteria-row">
      <div class="inline-filter-field date-wrapper">
        <label class="filter-label">Listing Date:</label>
        <p-datepicker
          formControlName="listingDate"
          placeholder="dd-mm-yyyy"
          dateFormat="dd-mm-yy"
          [showIcon]="true"
          [iconDisplay]="'input'"
          styleClass="w-full"
          inputStyleClass="dense-calendar-input"
        ></p-datepicker>
      </div>
      <div class="filter-actions-group">
        <button
          pButton
          type="submit"
          [label]="isLoading ? 'Searching...' : 'Search'"
          [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
          class="filter-search-btn"
          [disabled]="form.invalid || isLoading"
        ></button>
      </div>
    </div>
  </form>
</div>

<!-- SIMPLE MODERN LOADER -->
<!-- CENTERED SIMPLE MODERN LOADER -->
<div *ngIf="isLoading" class="centered-loader-wrap fade-in">
  <div class="loader-dots-row">
    <span class="pulse-dot"></span>
    <span class="pulse-dot"></span>
    <span class="pulse-dot"></span>
  </div>
  <p class="loader-label">Searching records...</p>
</div>

<!-- 2. Dynamic Table Display (Only shown after search completes) -->
<div *ngIf="!isLoading && hasSearched" class="fade-in-up">
  <app-custom-table
    [cols]="tableColumns"
    [data]="caseRecords"
    [showActions]="false"
  ></app-custom-table>
</div>
