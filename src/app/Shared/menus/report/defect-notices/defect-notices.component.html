<div class="view-header-nexus">
  <div class="title-accent-wrapper">
    <h2 class="section-title">Defect notices</h2>
  </div>
</div>
<div>
  <form [formGroup]="form" (ngSubmit)="onSearch()">
    <div class="filter-criteria-row">
      <div class="inline-filter-field dropdown-wrapper">
        <label class="filter-label">Show:</label>
        <p-select
          formControlName="show"
          [options]="showOption"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full white-bg-select"
        ></p-select>
      </div>

      <!-- Field Component 3: From Filing Calendar Datepicker -->
      <div class="inline-filter-field date-wrapper">
        <label class="filter-label">From filing date:</label>
        <p-datepicker
          formControlName="fromFilingDate"
          placeholder="dd-mm-yyyy"
          dateFormat="dd-mm-yy"
          [showIcon]="true"
          [iconDisplay]="'input'"
          styleClass="w-full"
          inputStyleClass="dense-calendar-input"
        ></p-datepicker>
      </div>

      <!-- Field Component 4: To Filing Calendar Datepicker -->
      <div class="inline-filter-field date-wrapper">
        <label class="filter-label">To filing date:</label>
        <p-datepicker
          formControlName="toFilingDate"
          placeholder="dd-mm-yyyy"
          dateFormat="dd-mm-yy"
          [showIcon]="true"
          [iconDisplay]="'input'"
          styleClass="w-full"
          inputStyleClass="dense-calendar-input"
        ></p-datepicker>
      </div>

      <!-- Field Component 2: Diary / Filing Input Text -->
      <div class="inline-filter-field text-input-wrapper">
        <label class="filter-label">Filing No:</label>
        <input
          pInputText
          type="text"
          formControlName="diaryFilingNo"
          class="w-full plain-text-input"
        />
      </div>

      <div class="inline-filter-field text-input-wrapper">
        <label class="filter-label">Keyword:</label>
        <input
          pInputText
          type="text"
          formControlName="diaryKeyword"
          class="w-full plain-text-input"
        />
      </div>

      <!-- Action Operational Utility Buttons Group -->
      <div class="filter-actions-group">
        <button
          pButton
          type="submit"
          [label]="isLoading ? 'Searching...' : 'Search'"
          [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
          class="filter-search-btn"
          [disabled]="form.invalid || isLoading"
        ></button>

        <button
          pButton
          type="button"
          label="Reset"
          icon="pi pi-refresh"
          (click)="onReset()"
          class="filter-reset-btn"
          [disabled]="isLoading"
        ></button>
      </div>
    </div>
  </form>
</div>
<div *ngIf="!isLoading && hasSearched" class="fade-in-up">
  <app-custom-table
    [cols]="tableColumns"
    [data]="caseRecords"
    [showActions]="true"
    [showMoreActions]="false"
    (onView)="handleRecordView($event)"
  ></app-custom-table>
</div>
<div *ngIf="isLoading" class="centered-loader-wrap fade-in">
  <div class="loader-dots-row">
    <span class="pulse-dot"></span>
    <span class="pulse-dot"></span>
    <span class="pulse-dot"></span>
  </div>
  <p class="loader-label">Searching records...</p>
</div>
