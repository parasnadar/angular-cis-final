<div class="dashboard-section-header view-header-nexus">
  <div class="title-accent-wrapper">
    <h2 class="section-title">Next Hearing Listing</h2>
  </div>
</div>

<div class="fade-in-container">
  <form [formGroup]="orderReport" class="workspace-form-layout">
    <div class="filter-criteria-row">
      <div class="inline-filter-field date-wrapper">
        <label class="filter-label">From Date:</label>
        <p-datepicker
          formControlName="fromDate"
          placeholder="dd-mm-yyyy"
          dateFormat="dd-mm-yy"
          [showIcon]="true"
          [iconDisplay]="'input'"
          styleClass="w-full"
          inputStyleClass="dense-calendar-input"
        ></p-datepicker>
      </div>
      <div class="inline-filter-field date-wrapper">
        <label class="filter-label">To Date:</label>
        <p-datepicker
          formControlName="toDate"
          placeholder="dd-mm-yyyy"
          dateFormat="dd-mm-yy"
          [showIcon]="true"
          [iconDisplay]="'input'"
          styleClass="w-full"
          inputStyleClass="dense-calendar-input"
        ></p-datepicker>
      </div>
      <div class="inline-filter-field dropdown-wrapper">
        <label class="filter-label">Court:</label>
        <p-select
          formControlName="courtNo"
          [options]="courtOption"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full white-bg-select locked-dropdown-frame"
          [style]="{ width: '100%', 'min-width': '0' }"
          placeholder="Search by"
        ></p-select>
      </div>

      <div class="filter-actions-group">
        <button
          pButton
          type="button"
          label="Search"
          (click)="onSearch()"
          class="filter-search-btn"
        ></button>
        <button
          pButton
          type="button"
          label="Reset"
          (click)="onReset()"
          class="filter-reset-btn"
        ></button>
      </div>
    </div>
  </form>
</div>
