<div class="dashboard-section-header view-header-nexus">
  <div class="title-accent-wrapper">
    <h2 class="section-title">Fresh Cases Allocation To Court</h2>
  </div>
</div>
<div class="fade-in-container">
  <form [formGroup]="form" class="workspace-form-layout">
    <div>
      <app-dynamic-radio-group
        formControlName="caseCategory"
        [options]="caseCategoryOptions"
        groupName="scrutinyCategories"
        [minWidthPx]="220"
      ></app-dynamic-radio-group>
    </div>

    <div class="filter-criteria-row">
      <div class="inline-filter-field dropdown-wrapper">
        <label class="filter-label">Court:</label>
        <p-select
          formControlName="courtNo"
          [options]="courtOption"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full white-bg-select locked-dropdown-frame"
          [style]="{ width: '100%', 'min-width': '0' }"
          placeholder="Search by"
        ></p-select>
      </div>

      <div class="inline-filter-field date-wrapper">
        <label class="filter-label">Listing Date:</label>
        <p-datepicker
          formControlName="listingDate"
          placeholder="dd-mm-yyyy"
          dateFormat="dd-mm-yy"
          [showIcon]="true"
          [iconDisplay]="'input'"
          styleClass="w-full"
          inputStyleClass="dense-calendar-input"
        ></p-datepicker>
      </div>

      <div class="inline-filter-field dropdown-wrapper">
        <label class="filter-label">Purpose:</label>
        <p-select
          formControlName="purpose"
          [options]="purposeOption"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full white-bg-select"
          styleClass="w-full white-bg-select locked-dropdown-frame"
          [style]="{ width: '100%', 'min-width': '0' }"
        ></p-select>
      </div>

      <div class="inline-filter-field text-input-wrapper">
        <label class="filter-label">Filing No:</label>
        <input
          pInputText
          type="text"
          formControlName="diaryFilingNo"
          class="w-full plain-text-input"
        />
      </div>

      <div class="filter-actions-group">
        <button
          pButton
          type="button"
          label="Search"
          (click)="onSearch()"
          [label]="isLoading ? 'Searching...' : 'Search'"
          [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
          class="filter-search-btn"
        ></button>
        <button
          pButton
          type="button"
          label="Reset"
          icon="pi pi-refresh"
          (click)="onReset()"
          class="filter-reset-btn"
        ></button>
      </div>
    </div>
  </form>
</div>
