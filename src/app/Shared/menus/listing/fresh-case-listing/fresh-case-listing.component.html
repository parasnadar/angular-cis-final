<div class="dashboard-section-header view-header-nexus">
  <div class="title-accent-wrapper">
    <h2 class="section-title">Fresh Cases Allocation To Court</h2>
  </div>
</div>
<div class="fade-in-container">
  <form [formGroup]="form" class="workspace-form-layout">
    <div>
      <app-dynamic-radio-group
        formControlName="caseCategory"
        [options]="caseCategoryOptions"
        groupName="scrutinyCategories"
        [minWidthPx]="220"
      ></app-dynamic-radio-group>
    </div>

    <div class="form-grid-columns">
      <div class="form-field-group">
        <label for="reg_location"
          >Court: <span class="required-star">*</span></label
        >
        <p-select
          formControlName="courtNo"
          [options]="courtOption"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full form-dropdown-field"
          [ngClass]="{ 'field-error-border': isFieldInvalid('courtNo') }"
          placeholder="Search by"
        ></p-select>
        <div class="error-msg-space" *ngIf="isFieldInvalid('courtNo')">
          <small class="error-text"
            ><i class="pi pi-times-circle"></i> Bench location selection is
            required.</small
          >
        </div>
      </div>

      <div class="form-field-group">
        <label class="filter-label">Listing Date:</label>
        <p-datepicker
          formControlName="listingDate"
          placeholder="dd-mm-yyyy"
          dateFormat="dd-mm-yy"
          [showIcon]="true"
          [iconDisplay]="'input'"
          styleClass="w-full form-calendar-field"
          [inputStyleClass]="
            isFieldInvalid('listingDate')
              ? 'w-full form-input-field field-error-border'
              : 'w-full form-input-field'
          "
        ></p-datepicker>
        <div class="error-msg-space" *ngIf="isFieldInvalid('listingDate')">
          <small class="error-text"
            ><i class="pi pi-times-circle"></i> Official mandatory retirement
            date target configuration is required.</small
          >
        </div>
      </div>

      <div class="form-field-group">
        <label class="filter-label">Purpose:</label>
        <p-select
          formControlName="purpose"
          [options]="purposeOption"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full form-dropdown-field"
          [ngClass]="{ 'field-error-border': isFieldInvalid('purpose') }"
        ></p-select>
        <div class="error-msg-space" *ngIf="isFieldInvalid('purpose')">
          <small class="error-text"
            ><i class="pi pi-times-circle"></i> First name is required (min 2
            characters).</small
          >
        </div>
      </div>

      <div class="form-field-group">
        <label class="filter-label">Filing No:</label>
        <input
          pInputText
          type="text"
          formControlName="diaryFilingNo"
          class="w-full plain-text-input"
          placeholder="Enter Filing No"
          [ngClass]="{ 'field-error-border': isFieldInvalid('diaryFilingNo') }"
        />
        <div class="error-msg-space" *ngIf="isFieldInvalid('diaryFilingNo')">
          <small class="error-text"
            ><i class="pi pi-times-circle"></i> First name is required (min 2
            characters).</small
          >
        </div>
      </div>

      <div class="filter-actions-group">
        <button
          pButton
          type="button"
          label="Search"
          (click)="onSearch()"
          [label]="isLoading ? 'Searching...' : 'Search'"
          [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
          class="filter-search-btn"
        ></button>
        <button
          pButton
          type="button"
          label="Reset"
          icon="pi pi-refresh"
          (click)="onReset()"
          class="filter-reset-btn"
        ></button>
      </div>
    </div>
  </form>
</div>
