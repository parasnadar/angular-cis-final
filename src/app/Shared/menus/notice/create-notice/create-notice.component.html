<div class="view-header-nexus">
  <div class="title-accent-wrapper">
    <h2 class="section-title">Notice/Summons Generation</h2>
  </div>
</div>

<div class="fade-in-container search-management-wrapper">
  <div class="search-tab-header">
    <button
      type="button"
      class="tab-toggle-btn"
      [class.is-active]="activeSearchTab === 'filing'"
      (click)="activeSearchTab = 'filing'; resetForms()"
    >
      <i class="pi pi-search btn-icon-gap"></i> Search by Filing Number
    </button>
    <button
      type="button"
      class="tab-toggle-btn"
      [class.is-active]="activeSearchTab === 'case'"
      (click)="activeSearchTab = 'case'; resetForms()"
    >
      <i class="pi pi-filter btn-icon-gap"></i> Search by Case Number
    </button>
  </div>

  <div class="form-content-card filter-card-container">
    @if (activeSearchTab === "filing") {
      <form
        [formGroup]="filingForm"
        class="workspace-form-layout"
        (ngSubmit)="onFilingSearch()"
      >
        <div class="filter-criteria-row">
          <div
            class="inline-filter-field text-input-wrapper custom-label-field"
          >
            <label class="filter-label">Filing Number:</label>
            <input
              pInputText
              type="text"
              formControlName="filingNo"
              class="w-full plain-text-input"
              (keypress)="blockNonNumbers($event)"
              placeholder="Enter numerical filing number"
            />
          </div>

          <div class="filter-actions-group">
            <button
              pButton
              type="submit"
              [label]="isLoading ? 'Searching...' : 'Search'"
              [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
              class="filter-search-btn"
              [disabled]="filingForm.invalid || isLoading"
            ></button>
            <button
              pButton
              type="button"
              label="Reset"
              icon="pi pi-refresh"
              (click)="resetForms()"
              class="filter-reset-btn"
              [disabled]="isLoading"
            ></button>
          </div>
        </div>
      </form>
    } @else if (activeSearchTab === "case") {
      <form
        [formGroup]="caseDetailsForm"
        class="workspace-form-layout"
        (ngSubmit)="onCaseSearch()"
      >
        <div class="filter-criteria-row">
          <div class="inline-filter-field dropdown-wrapper">
            <label class="filter-label">Case Type:</label>
            <p-select
              formControlName="caseType"
              [options]="caseTypeOption"
              optionLabel="label"
              optionValue="value"
              styleClass="w-full white-bg-select"
            ></p-select>
          </div>

          <div class="inline-filter-field text-input-wrapper">
            <label class="filter-label">Case No:</label>
            <input
              pInputText
              type="text"
              formControlName="caseNo"
              class="w-full plain-text-input"
              (keypress)="blockNonNumbers($event)"
              placeholder="Enter Case Number"
            />
          </div>

          <div class="inline-filter-field dropdown-wrapper">
            <label class="filter-label">Case Year:</label>
            <p-select
              formControlName="caseYear"
              [options]="caseYearOptions"
              optionLabel="label"
              optionValue="value"
              styleClass="w-full white-bg-select"
              [filter]="true"
              filterPlaceholder="Search year..."
            ></p-select>
          </div>

          <div class="filter-actions-group">
            <button
              pButton
              type="submit"
              class="filter-search-btn"
              [label]="isLoading ? 'Searching...' : 'Search'"
              [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-search'"
              [disabled]="caseDetailsForm.invalid || isLoading"
            ></button>
            <button
              pButton
              type="button"
              label="Reset"
              icon="pi pi-refresh"
              (click)="resetForms()"
              class="filter-reset-btn"
              [disabled]="isLoading"
            ></button>
          </div>
        </div>
      </form>
    }
  </div>
</div>

<!-- CENTERED SIMPLE MODERN LOADER -->
<div *ngIf="isLoading" class="centered-loader-wrap fade-in">
  <div class="loader-dots-row">
    <span class="pulse-dot"></span>
    <span class="pulse-dot"></span>
    <span class="pulse-dot"></span>
  </div>
  <p class="loader-label">Searching records...</p>
</div>

<!-- RESULTS SECTION: SUMMARY CARD + TABLE -->
<div *ngIf="!isLoading && hasSearched" class="fade-in-up results-wrapper">
  <!-- EXECUTIVE DOCKET SUMMARY CARD -->
  <div *ngIf="caseSummary" class="executive-docket-card fade-in">
    <!-- Centered Primary Litigant Header -->
    <div class="docket-hero-section text-center">
      <div class="cause-label-tag">CAUSE TITLE</div>
      <div class="litigant-headline">{{ caseSummary.causeTitle }}</div>
    </div>

    <!-- Micro Separator Line -->
    <div class="hairline-divider"></div>

    <!-- 3-Segment Metrics Row (Larger Fonts) -->
    <div class="docket-metrics-strip">
      <div class="metric-segment">
        <span class="segment-caption">Filing Number</span>
        <span class="segment-data font-numeric">{{
          caseSummary.filingNo
        }}</span>
      </div>

      <div class="metric-segment text-center-segment">
        <span class="segment-caption">Case No</span>
        <span class="segment-data">{{ caseSummary.caseNo }}</span>
      </div>

      <div class="metric-segment text-right-segment">
        <span class="segment-caption">Date of Filing</span>
        <span class="segment-data">{{ caseSummary.dateOfFiling }}</span>
      </div>
    </div>
  </div>

  <!-- 2. Dynamic Results Table -->
  <app-custom-table
    [cols]="tableColumns"
    [data]="caseRecords"
    (onView)="handleRecordView($event)"
    [showActions]="true"
  ></app-custom-table>
</div>
