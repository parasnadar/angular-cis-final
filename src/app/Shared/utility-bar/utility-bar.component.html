<!-- 1. TOP DOCK BAR -->
<div class="glass-utility-dock">
  <div class="dock-inner-flex">
    <!-- Mobile Hamburger Trigger (Visible on <= 850px) -->
    <button
      type="button"
      class="mobile-collapse-trigger"
      [class.is-open]="isMobileDrawerOpen"
      (click)="toggleMobileDrawer($event)"
      title="Open Menu"
    >
      <div class="hamburger-box">
        <span class="bar top-bar"></span>
        <span class="bar mid-bar"></span>
        <span class="bar btm-bar"></span>
      </div>
      <span class="mobile-trigger-label">Menu</span>
    </button>

    <!-- Desktop Navigation Track -->
    <nav class="dock-nav-track desktop-nav-track">
      <!-- Visible Normal Items -->
      <div
        *ngFor="let item of visibleMenuOptions; let idx = index"
        class="dock-nav-item-group"
      >
        <button
          type="button"
          class="dock-nav-pill"
          [class.is-active]="currentSelectedParent?.id === item.id"
          [class.dropdown-active]="activeDropdownIndex === idx"
          (click)="handleParentClick(item, idx, $event)"
        >
          <span class="pill-title-flex">
            <i *ngIf="item.icon" [class]="item.icon + ' core-pill-icon'"></i>
            <span class="pill-label-text">{{ item.label }}</span>
          </span>
          <i
            *ngIf="item.children && item.children.length > 0"
            class="pi pi-chevron-down dynamic-arrow-icon"
          ></i>
        </button>

        <!-- Submenu Flyout -->
        <div
          *ngIf="item.children && item.children.length > 0"
          class="dock-flyout-panel desktop-only-panel"
          [class.is-expanded]="activeDropdownIndex === idx"
        >
          <div class="flyout-inner-container">
            <button
              *ngFor="let child of item.children"
              type="button"
              class="flyout-action-node"
              [class.is-node-selected]="currentSelectedItem?.id === child.id"
              (click)="handleChildClick(item, child, $event)"
            >
              <span class="node-title-flex">
                <i *ngIf="child.icon" [class]="child.icon + ' node-icon'"></i>
                <span class="node-label-text">{{ child.label }}</span>
              </span>
              <i
                *ngIf="currentSelectedItem?.id === child.id"
                class="pi pi-check selection-check-ico"
              ></i>
            </button>
          </div>
        </div>
      </div>

      <!-- MORE OPTIONS OVERFLOW PILL -->
      <div *ngIf="overflowMenuOptions.length > 0" class="dock-nav-item-group">
        <button
          type="button"
          class="dock-nav-pill more-trigger-pill"
          [class.is-active]="isOverflowActive()"
          [class.dropdown-active]="isMoreMenuOpen"
          (click)="toggleMoreMenu($event)"
        >
          <span class="pill-title-flex">
            <i class="pi pi-ellipsis-h core-pill-icon"></i>
            <span class="pill-label-text">More</span>
          </span>
          <i class="pi pi-chevron-down dynamic-arrow-icon"></i>
        </button>

        <!-- More Flyout Grid -->
        <div
          class="dock-flyout-panel desktop-only-panel more-flyout-grid"
          [class.is-expanded]="isMoreMenuOpen"
        >
          <div class="flyout-inner-container">
            <ng-container *ngFor="let overItem of overflowMenuOptions">
              <!-- Item without children -->
              <button
                *ngIf="!overItem.children || overItem.children.length === 0"
                type="button"
                class="flyout-action-node"
                [class.is-node-selected]="
                  currentSelectedParent?.id === overItem.id
                "
                (click)="handleParentClick(overItem, -1, $event)"
              >
                <span class="node-title-flex">
                  <i
                    *ngIf="overItem.icon"
                    [class]="overItem.icon + ' node-icon'"
                  ></i>
                  <span class="node-label-text">{{ overItem.label }}</span>
                </span>
                <i
                  *ngIf="currentSelectedParent?.id === overItem.id"
                  class="pi pi-check selection-check-ico"
                ></i>
              </button>

              <!-- Item with children -->
              <div
                *ngIf="overItem.children && overItem.children.length > 0"
                class="nested-group-block"
              >
                <div class="nested-group-title">
                  <i *ngIf="overItem.icon" [class]="overItem.icon"></i>
                  <span>{{ overItem.label }}</span>
                </div>
                <button
                  *ngFor="let child of overItem.children"
                  type="button"
                  class="flyout-action-node nested-child-node"
                  [class.is-node-selected]="
                    currentSelectedItem?.id === child.id
                  "
                  (click)="handleChildClick(overItem, child, $event)"
                >
                  <span class="node-title-flex">
                    <i
                      *ngIf="child.icon"
                      [class]="child.icon + ' node-icon'"
                    ></i>
                    <span class="node-label-text">{{ child.label }}</span>
                  </span>
                  <i
                    *ngIf="currentSelectedItem?.id === child.id"
                    class="pi pi-check selection-check-ico"
                  ></i>
                </button>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </nav>

    <!-- Right Profile Section -->
    <div class="dock-utilities-dock">
      <ng-content select="[actions]"></ng-content>

      <div class="dock-profile-segment">
        <button
          type="button"
          class="dock-profile-trigger"
          [class.is-active-panel]="isProfileMenuOpen"
          (click)="toggleProfileMenu($event)"
        >
          <div class="dock-avatar-frame">
            <span>{{ initials() }}</span>
          </div>
          <div class="dock-profile-meta">
            <span class="meta-user-name">{{ username() }}</span>
          </div>
          <i class="pi pi-chevron-down trigger-arrow"></i>
        </button>

        <div
          class="dock-profile-dropdown"
          [class.is-visible]="isProfileMenuOpen"
        >
          <div class="dropdown-actions-list">
            <button
              type="button"
              class="dropdown-action-row"
              (click)="handleAccountAction('change_password')"
            >
              <div class="row-icon-box shield-variant">
                <i class="pi pi-shield"></i>
              </div>
              <span class="row-label">Change Password</span>
            </button>

            <button
              type="button"
              class="dropdown-action-row logout-variant"
              (click)="handleAccountAction('logout')"
            >
              <div class="row-icon-box power-variant">
                <i class="pi pi-power-off"></i>
              </div>
              <span class="row-label">Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 2. FULL SCREEN MOBILE DRAWER (PLACED OUTSIDE TO ESCAPE STACKING BOUNDS) -->
<div
  class="mobile-collapsed-drawer-panel"
  [class.is-drawer-open]="isMobileDrawerOpen"
>
  <div
    class="mobile-drawer-backdrop"
    (click)="isMobileDrawerOpen = false"
  ></div>

  <div class="mobile-drawer-surface">
    <div class="mobile-drawer-header">
      <div class="drawer-header-left">
        <span class="drawer-title">Navigation</span>
        <span class="drawer-subtitle">All Services & Modules</span>
      </div>
      <button
        type="button"
        class="drawer-close-btn"
        (click)="isMobileDrawerOpen = false"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="mobile-drawer-scrollable">
      <div
        *ngFor="let item of menuOptions; let idx = index"
        class="mobile-drawer-item"
      >
        <!-- Direct Item -->
        <button
          *ngIf="!item.children || item.children.length === 0"
          type="button"
          class="mobile-drawer-link"
          [class.is-active-mobile]="currentSelectedParent?.id === item.id"
          (click)="handleParentClick(item, idx, $event)"
        >
          <span class="link-label-group">
            <i *ngIf="item.icon" [class]="item.icon + ' m-icon'"></i>
            <span>{{ item.label }}</span>
          </span>
          <i
            *ngIf="currentSelectedParent?.id === item.id"
            class="pi pi-check m-check"
          ></i>
        </button>

        <!-- Accordion Item with Children -->
        <div
          *ngIf="item.children && item.children.length > 0"
          class="mobile-accordion-group"
        >
          <button
            type="button"
            class="mobile-drawer-link accordion-toggle"
            [class.is-active-mobile]="currentSelectedParent?.id === item.id"
            (click)="toggleMobileAccordion(idx, $event)"
          >
            <span class="link-label-group">
              <i *ngIf="item.icon" [class]="item.icon + ' m-icon'"></i>
              <span>{{ item.label }}</span>
            </span>
            <i
              class="pi pi-chevron-down m-arrow"
              [class.is-rotated]="activeMobileAccordionIndex === idx"
            ></i>
          </button>

          <div
            *ngIf="activeMobileAccordionIndex === idx"
            class="mobile-accordion-body"
          >
            <button
              *ngFor="let child of item.children"
              type="button"
              class="mobile-sublink"
              [class.is-sub-active]="currentSelectedItem?.id === child.id"
              (click)="handleChildClick(item, child, $event)"
            >
              <span class="sublink-text">
                <i *ngIf="child.icon" [class]="child.icon + ' sub-icon'"></i>
                <span>{{ child.label }}</span>
              </span>
              <i
                *ngIf="currentSelectedItem?.id === child.id"
                class="pi pi-check m-check"
              ></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
