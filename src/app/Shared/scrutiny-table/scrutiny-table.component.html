<div class="table-container fade-in-container">
  <p-table
    #dt
    [value]="data"
    [rows]="selectedRowsCount"
    [paginator]="true"
    [globalFilterFields]="globalFilterFields"
    styleClass="p-datatable-striped p-datatable-gridlines scrutiny-grid"
    [rowsPerPageOptions]="[5, 10, 25, 50]"
  >
    <!-- Upper Toolbar -->
    <ng-template pTemplate="caption">
      <div class="table-toolbar">
        <div class="toolbar-left">
          <p-select
            [(ngModel)]="selectedRowsCount"
            [options]="rowsOptions"
            optionLabel="label"
            optionValue="value"
            styleClass="compact-select"
          ></p-select>
        </div>

        <div class="toolbar-right">
          <i class="pi pi-search search-icon"></i>
          <input
            pInputText
            type="text"
            [(ngModel)]="globalSearchText"
            (input)="dt.filterGlobal(globalSearchText, 'contains')"
            placeholder="Quick search..."
            class="search-input"
          />
        </div>
      </div>
    </ng-template>

    <!-- Headers -->
    <ng-template pTemplate="header">
      <tr>
        <th
          *ngFor="let col of cols"
          [style.width]="col.width || 'auto'"
          [style.text-align]="col.align || 'left'"
        >
          {{ col.header }}
        </th>
      </tr>
    </ng-template>

    <!-- Body (Row class applied here) -->
    <ng-template pTemplate="body" let-item>
      <tr class="grid-row" [ngClass]="getRowClass(item)">
        <td *ngFor="let col of cols" [style.text-align]="col.align || 'left'">
          <!-- 1. Slot: Case Type (caseDetails) -->
          <ng-container
            *ngIf="col.field === 'caseDetails' && caseDetailsTemplate"
          >
            <ng-container
              *ngTemplateOutlet="
                caseDetailsTemplate;
                context: { $implicit: item }
              "
            ></ng-container>
          </ng-container>

          <!-- 2. Slot: Diary/Filing No (location) -->
          <ng-container *ngIf="col.field === 'location' && diaryTemplate">
            <ng-container
              *ngTemplateOutlet="diaryTemplate; context: { $implicit: item }"
            ></ng-container>
          </ng-container>

          <!-- 3. Slot: Action Column (Action) -->
          <ng-container *ngIf="col.field === 'Action' && actionTemplate">
            <ng-container
              *ngTemplateOutlet="actionTemplate; context: { $implicit: item }"
            ></ng-container>
          </ng-container>

          <!-- 4. Default Render for All Other Columns -->
          <ng-container
            *ngIf="
              !(col.field === 'caseDetails' && caseDetailsTemplate) &&
              !(col.field === 'location' && diaryTemplate) &&
              !(col.field === 'Action' && actionTemplate)
            "
          >
            {{ getFieldValue(item, col.field) }}
          </ng-container>
        </td>
      </tr>
    </ng-template>

    <!-- Empty State -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="cols.length" class="empty-state">
          <p>No matching legal records found.</p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
