<div class="d-flex flex-column min-vh-100">
  <header class="glass-header-wrapper">
    <div class="container-fluid">
      <div class="header-inner">
        <div class="header-left">
          <a class="brand-link" href="#">
            <img
              src="assets/images/logo.png"
              alt="Main Logo"
              class="logo-main"
            />
          </a>
        </div>

        <div class="header-right">
          <div class="logo-group">
            <img
              src="assets/images/logo_sb.png"
              alt="Secondary Logo 1"
              class="logo-side"
            />
            <div class="vertical-divider"></div>
            <img
              src="assets/images/logo_di.png"
              alt="Secondary Logo 2"
              class="logo-side"
            />
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow-1">
    <p-toast />
    <router-outlet></router-outlet>
  </main>

  <footer class="gov-footer">
    <div class="footer-cols">
      <!-- Column 1: Brand & Location (Now side-by-side to save height) -->
      <div class="footer-col footer-col-brand">
        <img
          src="assets/images/logo.png"
          class="footer-ashoka-logo"
          alt="State Emblem of India"
        />
        <div class="brand-info">
          <strong>GSTAT</strong>
          <p>
            6th Floor, LIC Jeevan Bharati, Tower I, Janpath, Connaught Place,
            New Delhi 110001
          </p>
        </div>
      </div>

      <!-- Column 2: Links -->
      <div class="footer-col footer-col-links">
        <div class="gf-title">Links</div>
        <ul>
          <li><a href="#">Help Center</a></li>
        </ul>
      </div>

      <!-- Column 3: System Info -->
      <div class="footer-col footer-col-sys">
        <div class="gf-title">System Information</div>
        <p class="sys-text">Version: <b>2.0.0</b></p>
      </div>
    </div>

    <!-- Your exact glass footer structure -->
    <div class="glass-footer-premium">
      <div class="footer-glass-content">
        Designed & Developed by
        <span class="nic-brand">National Informatics Centre (NIC)</span>
      </div>
    </div>
  </footer>
</div>
